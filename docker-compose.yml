services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://docflow:docflow@db:5432/docflow
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      db: {condition: service_healthy}
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      DATABASE_URL: postgresql+psycopg2://docflow:docflow@db:5432/docflow
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
